<!DOCTYPE html>
<html>
<head>
  <title>Browse - Netflix</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .browse-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 50px; background: #000; position: sticky; top:0; z-index: 100; }
    #searchInput { padding: 8px 15px; width: 280px; background: #222; border: 1px solid #555; color: white; border-radius: 4px; }
    .category { padding: 20px 50px; }
    .movie-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
    .movie-card img { width: 100%; height: 240px; object-fit: cover; border-radius: 5px; transition: 0.3s; }
    .movie-card img:hover { transform: scale(1.05); }
    .movie-card p { font-size: 13px; margin-top: 5px; color: #ccc; text-align: center; }
  </style>
</head>
<body style="background: #141414;">

  <nav class="browse-nav">
    <h1 class="logo">NETFLIX</h1>
    <div style="display:flex; gap:10px;">
      <input type="text" id="searchInput" placeholder="Search 50 movies...">
      <button class="sign-in-btn" onclick="window.location.href='index.html'">Home</button>
    </div>
  </nav>

const base = "https://image.tmdb.org/t/p/w500/";
const container = document.getElementById("movieContainer");

// Fallback ke liye agar koi poster fail ho to dusra dikhega
const finalList = allMovies.slice(0,50);

finalList.forEach(m => {
  // Agar image load fail ho to placeholder
  container.innerHTML += `
    <div class="movie-card" data-title="${m.t.toLowerCase()}">
      <img src="${base+m.p}" onerror="this.src='https://via.placeholder.com/160x240?text=${m.t}'">
      <p>${m.t}</p>
    </div>`;
});

// Search
document.getElementById("searchInput").addEventListener("input", (e) => {
  const f = e.target.value.toLowerCase();
  document.querySelectorAll(".movie-card").forEach(c => {
    c.style.display = c.dataset.title.includes(f) ? "block" : "none";
  });
});
